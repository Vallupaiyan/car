
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarZone Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("https://images.unsplash.com/photo-1503376780353-7e6692767b70") center/cover;
}

.register-container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-box{
    width:450px;
    background:rgba(0,0,0,0.75);
    padding:40px;
    border-radius:15px;
    backdrop-filter:blur(10px);
    color:white;
    text-align:center;
}

.register-box h1{
    margin-bottom:10px;
}

.register-box p{
    color:#ccc;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

.register-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#f8c146;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.register-btn:hover{
    background:#ffda6a;
}

.login-link{
    margin-top:20px;
}

.login-link a{
    color:#f8c146;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="register-container">
    <div class="register-box">

        <h1>Create Account</h1>
        <p>Join CarZone Today</p>

<form method="POST"
      action="/save/"
      onsubmit="return validateForm()">

    {% csrf_token %}

    <div class="input-box">
        <input type="text" id="name" name="name" placeholder="Full Name">
    </div>

    <div class="input-box">
        <input type="tel" id="phone" name="phone" placeholder="Phone Number">
    </div>

    <div class="input-box">
        <input type="email" id="email" name="email" placeholder="Email Address">
    </div>

    <div class="input-box">
        <input type="text" id="place" name="place" placeholder="Place">
    </div>

    <div class="input-box">
        <input type="password" id="password" name="password" placeholder="Password">
    </div>

    <div class="input-box">
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password">
    </div>

    <button type="submit" class="register-btn">
        Register
    </button>
</form>
<script>
function validateForm() {

    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let email = document.getElementById("email").value.trim();
    let place = document.getElementById("place").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirm_password").value;

    // Name validation
    if (name.length < 3) {
        alert("Name must contain at least 3 characters");
        return false;
    }

    // Phone validation
    if (!/^[0-9]{10}$/.test(phone)) {
        alert("Enter a valid 10 digit phone number");
        return false;
    }

    // Email validation
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (!emailPattern.test(email)) {
        alert("Enter a valid email address");
        return false;
    }

    // Place validation
    if (place.length < 3) {
        alert("Enter a valid place");
        return false;
    }

    // Password validation
    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return false;
    }

    // Confirm password validation
    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return false;
    }

    return true;
}
</script>

    </div>
</div>

</body>
</html>
